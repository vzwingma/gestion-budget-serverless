#ODIC JWT Validation
oidc.jwt.id.appusercontent=test

# Tests : quarkus-oidc valide les jetons signés par JwtTestSupport avec une clé publique locale (pas de discovery ni d'appel à Google)
quarkus.oidc.application-type=service
quarkus.oidc.public-
quarkus.oidc.client-id=${oidc.jwt.id.appusercontent}.apps.googleusercontent.com
quarkus.oidc.token.audience=${oidc.jwt.id.appusercontent}.apps.googleusercontent.com
quarkus.oidc.token.issuer=any
quarkus.oidc.token.principal-claim=email
quarkus.oidc.devservices.enabled=false
quarkus.keycloak.devservices.enabled=false
# Securite : OidcProvider ecrit le jeton COMPLET en WARN sur signature invalide/jeton mal forme (AP004 T0.5)
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR
