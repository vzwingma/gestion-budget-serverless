# Configuration du service Paramétrages (AP004 T2.3, ADR-009) : un seul fichier, profils Quarkus.
#
# - Configuration commune (MongoDB, OIDC, CORS, logs, #55278, masquage OidcProvider) :
#   communs/src/main/resources/META-INF/microprofile-config.properties. Seules les cles propres au service sont ici.
# - Profils : sans prefixe = dev + test ; %dev. = quarkus:dev ; %dev,test. = dev + test ; %prod. = Lambda (natif).
#   Ancien profil Maven dev = sans prefixe + %dev. ; ancien profil Maven native = %prod.
# - MongoDB Atlas : variables d'environnement QUARKUS_MONGODB_CONNECTION_STRING et QUARKUS_MONGODB_DATABASE (voir communs).

# --- Application ---
%dev,test.quarkus.http.port=8091
%dev,test.quarkus.lambda.mock-event-server.dev-port=8091
%prod.quarkus.application.name=API Paramétrages

# --- Clients REST ---
quarkus.rest-client.jwt-signing-key-service.url=https://www.googleapis.com
quarkus.rest-client.jwt-signing-key-service.scope=jakarta.enterprise.context.ApplicationScoped
quarkus.rest-client.enable-compression=true

# --- Logs ---
%dev.quarkus.log.category."io.github.vzwingma.finances.budget.serverless.services.parametrages".level=DEBUG
%prod.quarkus.log.category."io.github.vzwingma.finances.budget.serverless.services.parametrages".level=${QUARKUS_LOG_LEVEL:INFO}

# --- OIDC : /_info public, tenant desactive lie au seul chemin /_info (ADR-008) ---
quarkus.oidc.info-public.tenant-paths=/parametres/v2/_info
