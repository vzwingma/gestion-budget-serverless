# Configuration du service Opérations (AP004 T2.3, ADR-009) : un seul fichier, profils Quarkus.
#
# - Configuration commune (MongoDB, OIDC, CORS, logs, #55278, masquage OidcProvider) :
#   communs/src/main/resources/META-INF/microprofile-config.properties. Seules les cles propres au service sont ici.
# - Profils : sans prefixe = dev + test ; %dev. = quarkus:dev ; %dev,test. = dev + test ; %prod. = Lambda (natif).
#   Ancien profil Maven dev = sans prefixe + %dev. ; ancien profil Maven native = %prod.
# - MongoDB Atlas : variables d'environnement QUARKUS_MONGODB_CONNECTION_STRING et QUARKUS_MONGODB_DATABASE (voir communs).

# --- Application ---
%dev,test.quarkus.http.port=8094
%dev,test.quarkus.lambda.mock-event-server.dev-port=8094
%prod.quarkus.application.name=API Opérations

# --- Clients REST ---
quarkus.rest-client.parametrages-service.url=http://localhost:8091
%prod.quarkus.rest-client.parametrages-service.url=${APP_CONFIG_URL_BACKENDS:http://localhost:8091}
quarkus.rest-client.parametrages-service.scope=jakarta.enterprise.context.ApplicationScoped
quarkus.rest-client.comptes-service.url=http://localhost:8092
%prod.quarkus.rest-client.comptes-service.url=${APP_CONFIG_URL_BACKENDS:http://localhost:8092}
quarkus.rest-client.comptes-service.scope=jakarta.enterprise.context.ApplicationScoped
quarkus.rest-client.enable-compression=true

# --- Logs ---
quarkus.log.category."io.github.vzwingma.finances.budget.serverless.services.operations".level=DEBUG
%prod.quarkus.log.category."io.github.vzwingma.finances.budget.serverless.services.operations".level=${QUARKUS_LOG_LEVEL:INFO}

# --- OIDC : /_info public, tenant desactive lie au seul chemin /_info (ADR-008) ---
quarkus.oidc.info-public.tenant-paths=/budgets/v2/_info
