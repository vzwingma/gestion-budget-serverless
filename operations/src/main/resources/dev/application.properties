# configure the MongoDB client for Atlas
# by environment variable.
# - QUARKUS_MONGODB_CONNECTION-STRING = mongodb+srv://<login>:<mdp>@cluster<name>.mongodb.net/<database>?retryWrites=true&w=majority
# - QUARKUS_MONGODB_DATABASE = <database>
quarkus.http.port=8094
quarkus.lambda.mock-event-server.dev-port=8094
# configure the MongoDB client for Atlas
%dev.quarkus.mongodb.connection-string=${QUARKUS_MONGODB_CONNECTION_STRING:mongodb://localhost:27017}
# mandatory if you don't specify the name of the database using @MongoEntity
quarkus.mongodb.database=${QUARKUS_MONGODB_DATABASE:v12-app-dev}
# configure the REST Clients

quarkus.rest-client.parametrages-service.url=http://localhost:8091
quarkus.rest-client.parametrages-service.scope=jakarta.enterprise.context.ApplicationScoped
quarkus.rest-client.comptes-service.url=http://localhost:8092
quarkus.rest-client.comptes-service.scope=jakarta.enterprise.context.ApplicationScoped
quarkus.http.enable-compression=true
# global configuration is used for all clients
quarkus.rest-client-reactive.enable-response-decompression=true

# CORS Param
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=${APP_CONFIG_URL_IHM:http://localhost:3000}
quarkus.http.cors.headers=Content-Type,Authorization,X-Api-Key
quarkus.http.cors.methods=DELETE,GET,HEAD,OPTIONS,POST,PUT
%dev.quarkus.http.cors.access-control-allow-credentials=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.mongodb.driver".level=INFO
quarkus.log.category."io.github.vzwingma.finances.budget.serverless.services.operations".level=DEBUG
quarkus.log.category."io.github.vzwingma.finances.budget.services.communs".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}], [%c{2.}:%L] %X{budgetContext} %s%e%n
#ODIC JWT Validation
oidc.jwt.id.appusercontent=${OIDC_JWT_ID_APPUSERCONTENT:550431928138-edestj28rk5a0emk546p7ii28dl5boc5}

# Authentification : validation des id_token Google par quarkus-oidc (ADR-005)
# - signature, aud, exp et rotation JWKS (kid inconnu => rechargement) gérés par l'extension
# - token.issuer=any : Google émet iss=accounts.google.com ou https://accounts.google.com ; contrôle strict des deux formes dans JwtRolesAugmentor
# - auth-server-url limité aux profils dev/prod : le profil test utilise une clé publique locale (pas d'appel à Google)
# - principal = email (comme l'ancien JwtSecurityContext)
quarkus.oidc.application-type=service
%dev.quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${oidc.jwt.id.appusercontent}.apps.googleusercontent.com
quarkus.oidc.token.audience=${oidc.jwt.id.appusercontent}.apps.googleusercontent.com
quarkus.oidc.token.issuer=any
quarkus.oidc.token.principal-claim=email
# Discovery conservée ; timeouts compatibles init Lambda (~10 s) : 3 s par tentative, fenêtre de retry initiale 4 s (AP004 T0.6)
quarkus.oidc.connection-timeout=3S
quarkus.oidc.connection-delay=4S

# Workaround bug Quarkus 3.37.1 (quarkusio/quarkus#55278) : serializers Jackson reflection-free
# omettent les champs de type wrapper numerique (Long/Integer/...) nuls, ignorant @JsonInclude.
# A retirer une fois le fix backporte sur une version 3.37.x/3.38.x publiee.
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=false
# Securite : OidcProvider ecrit le jeton COMPLET en WARN sur signature invalide/jeton mal forme (AP004 T0.5)
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR
