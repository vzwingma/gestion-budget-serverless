# Configuration COMMUNE aux 4 services (AP004 T2.2, ADR-009).
#
# Lue par MicroProfile Config dans le jar communs (ordinal 100). Elle est surchargee par l'application.properties de
# chaque module (ordinal 250, cles propres au module) et par celui des tests (src/test/resources).
#
# Profils : sans prefixe = dev + test + prod ; %dev,prod. = tout sauf les tests ; %prod. = Lambda uniquement.
# Les tests n'ont donc ni chaine de connexion MongoDB (Dev Services demarre un conteneur) ni auth-server-url
# (pas d'appel a Google : la cle publique locale de test est utilisee).
#
# ATTENTION : SmallRye resout "%profil.cle" dans TOUTES les sources avant "cle". Ne jamais definir la meme cle avec
# un prefixe de profil ici et sans prefixe dans un module : la version prefixee gagnerait toujours.

# --- MongoDB Atlas (variables d'environnement QUARKUS_MONGODB_CONNECTION_STRING et QUARKUS_MONGODB_DATABASE) ---
%dev,prod.quarkus.mongodb.connection-string=${QUARKUS_MONGODB_CONNECTION_STRING:mongodb://localhost:27017}
quarkus.mongodb.database=${QUARKUS_MONGODB_DATABASE:v12-app-dev}
%prod.quarkus.mongodb.database=${QUARKUS_MONGODB_DATABASE:database}
%prod.quarkus.mongodb.metrics.enabled=true
# Timeouts et pool du client MongoDB (AP004 T1.2c) : tous < timeout Lambda de 15 s
quarkus.mongodb.server-selection-timeout=5S
quarkus.mongodb.connect-timeout=3S
quarkus.mongodb.read-timeout=8S
quarkus.mongodb.max-pool-size=10
quarkus.mongodb.min-pool-size=0
quarkus.mongodb.max-connection-idle-time=60S

# --- HTTP ---
quarkus.http.enable-compression=true

# --- CORS (en production, l'API Gateway en frontal gere aussi le CORS) ---
quarkus.http.cors.enabled=true
%dev,prod.quarkus.http.cors.origins=${APP_CONFIG_URL_IHM:http://localhost:3000}
quarkus.http.cors.headers=Content-Type,Authorization,X-Api-Key
%prod.quarkus.http.cors.headers=Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token
quarkus.http.cors.methods=DELETE,GET,HEAD,OPTIONS,POST,PUT
%dev,prod.quarkus.http.cors.access-control-allow-credentials=true

# --- Logs ---
quarkus.log.level=INFO
%prod.quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.category."org.mongodb.driver".level=INFO
%prod.quarkus.log.category."org.mongodb.driver".level=${MONGODB_LOG_LEVEL:WARN}
quarkus.log.category."io.github.vzwingma.finances.budget.services.communs".level=DEBUG
%prod.quarkus.log.category."io.github.vzwingma.finances.budget.services.communs".level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.console.format=%d{HH:mm:ss} %-5p [traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}], [%c{2.}:%L] %X{budgetContext} %s%e%n
%prod.quarkus.log.console.format=%d{HH:mm:ss} %-5p [traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}], [%c{2.}] %X{budgetContext} %s%e%n
# Securite : OidcProvider ecrit le jeton COMPLET en WARN sur signature invalide/jeton mal forme (AP004 T0.5, risque R6)
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR

# --- Authentification : validation des id_token Google par quarkus-oidc (ADR-005) ---
# - signature, aud, exp et rotation JWKS (kid inconnu => rechargement) geres par l'extension
# - token.issuer=any : Google emet iss=accounts.google.com ou https://accounts.google.com ; controle strict des deux formes dans JwtRolesAugmentor
# - auth-server-url limite aux profils dev/prod : le profil test utilise une cle publique locale (pas d'appel a Google)
# - principal = email (comme l'ancien JwtSecurityContext)
# - info-public.tenant-paths (chemin /_info du service) reste dans l'application.properties de chaque module (ADR-008)
oidc.jwt.id.appusercontent=${OIDC_JWT_ID_APPUSERCONTENT:550431928138-edestj28rk5a0emk546p7ii28dl5boc5}
quarkus.oidc.application-type=service
%dev,prod.quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${oidc.jwt.id.appusercontent}.apps.googleusercontent.com
quarkus.oidc.token.audience=${oidc.jwt.id.appusercontent}.apps.googleusercontent.com
quarkus.oidc.token.issuer=any
quarkus.oidc.token.principal-claim=email
# Discovery conservee ; timeouts compatibles init Lambda (~10 s) : 3 s par tentative, fenetre de retry initiale 4 s (AP004 T0.6)
quarkus.oidc.connection-timeout=3S
quarkus.oidc.connection-delay=4S
# /_info public : tenant OIDC desactive lie au seul chemin /_info, requete traitee en anonyme (ADR-008)
quarkus.oidc.info-public.tenant-enabled=false

# --- Workaround bug Quarkus 3.37.1 (quarkusio/quarkus#55278) ---
# serializers Jackson reflection-free omettent les champs de type wrapper numerique (Long/Integer/...) nuls, ignorant @JsonInclude.
# A retirer une fois le fix backporte sur une version 3.37.x/3.38.x publiee.
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=false
