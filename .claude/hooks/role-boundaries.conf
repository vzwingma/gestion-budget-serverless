# Frontières de rôle — lues par .claude/hooks/guard.sh (PreToolUse Edit|Write|NotebookEdit).
#
# Format : <agent> <allow|deny> <glob>
#   - glob relatif à la racine du projet, insensible à la casse ; `*` couvre aussi `/`.
#   - Règles ORDONNÉES par agent : la première ligne qui correspond au chemin décide
#     (allow → écriture autorisée, deny → bloquée).
#   - Aucune ligne ne correspond : bloqué si l'agent a au moins une ligne allow (liste blanche), autorisé sinon.
#   - Agent absent du fichier → aucune restriction. Fichiers hors du projet (scratchpad…) → non contrôlés.
# L'agent est identifié par le champ agent_type du hook (sous-agent ou session `claude --agent <nom>`).
# Adapter au projet (skill init-harness). 🟠 ARCos est déjà en lecture seule par ses outils.

# ⚫ MAINa : plans, rapports, index et statut des ADR uniquement
MAINa   allow  .claude/plans/*
MAINa   allow  docs/adr/*

# 🔵 DEVon : ni tests ni documentation — sauf ses rapports de phase ; tout le reste autorisé
DEVon   allow  .claude/plans/*
DEVon   deny   *.test.*
DEVon   deny   *.spec.*
DEVon   deny   *__tests__/*
DEVon   deny   docs/*
DEVon   deny   README.md
DEVon   allow  *

# 🟢 QALvin : fichiers de test et rapports de phase uniquement
QALvin  allow  .claude/plans/*
QALvin  allow  *.test.*
QALvin  allow  *.spec.*
QALvin  allow  *__tests__/*
QALvin  allow  *__mocks__/*
QALvin  allow  *tests/*
QALvin  allow  *test/*
QALvin  allow  *fixtures/*

# 🟣 DOCly : documentation uniquement
DOCly   allow  *.md
DOCly   allow  docs/*
